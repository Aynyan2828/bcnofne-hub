<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Angleon</title>
<style>
  :root { --fg:#fff; --bg:#000; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",sans-serif;overflow:hidden;touch-action:none}
  body.light{--fg:#111;--bg:#fff}
  #c{display:block;width:100vw;height:100vh}
  #ui{position:fixed;left:0;right:0;bottom:0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
  #ui .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
  button{font:14px/1 inherit;padding:9px 13px;border-radius:999px;border:1px solid rgba(128,128,128,.5);background:rgba(128,128,128,.18);color:var(--fg);cursor:pointer;backdrop-filter:blur(6px)}
  button.on{background:rgba(70,140,255,.55);border-color:rgba(70,140,255,.9)}
  #hud{position:fixed;left:14px;top:14px;font-size:12px;opacity:.6;font-family:ui-monospace,Menlo,monospace;pointer-events:none}
  #label{position:fixed;right:16px;top:14px;font-size:26px;font-weight:700;pointer-events:none;transition:opacity .15s}
  body.norec #ui,body.norec #hud,body.norec #label{display:none}
  #recdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e33;margin-right:6px;vertical-align:middle}
</style>

      const x = flat[k][0], y = flat[k][1];
      out[k * 3] = B.right[0] * x + B.up[0] * y + B.dir[0] * t;
      out[k * 3 + 1] = B.right[1] * x + B.up[1] * y + B.dir[1] * t;
      out[k * 3 + 2] = B.right[2] * x + B.up[2] * y + B.dir[2] * t;
    }
    pointCount += flat.length;
    if (!groups.has(s.c)) groups.set(s.c, []);
    groups.get(s.c).push(out);
  }
  return { id: d.id, label: d.label || d.id, view: d.view, basis: B, groups: [...groups].map(([c, strokes]) => ({ color: c, strokes })), pointCount };
});

// ===== カメラ状態 =====
const cam = { yaw: 0, pitch: 0 };
let vel = [0, 0], dragging = false, last = null, lastT = 0, tour = false, dark = true, tourT0 = 0, tourOffset = 0;
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const hud = document.getElementById('hud'), label = document.getElementById('label');
let fixedSize = null;   // [w,h] 動画書き出し用

function resize() {
  const dpr = fixedSize ? 1 : Math.min(2, devicePixelRatio || 1);
  const w = fixedSize ? fixedSize[0] : innerWidth, h = fixedSize ? fixedSize[1] : innerHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
}
addEventListener('resize', resize); resize();

function brighten(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const f = v => Math.round(76 + 0.7 * v);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
const rgba = (c, a) => { const m = c.match(/\d+/g); return m && !c.startsWith('#') ? `rgba(${m[0]},${m[1]},${m[2]},${a})` : c + Math.round(a * 255).toString(16).padStart(2, '0'); };

function revealWeight(d) { return smooth(1 - angleDeg(basis(cam.yaw, cam.pitch).dir, d.basis.dir) / DATA.revealAngleDeg); }
function nearest() {
  const dir = basis(cam.yaw, cam.pitch).dir; let best = null;
  for (const d of drawings) { const a = angleDeg(dir, d.basis.dir); if (!best || a < best[1]) best = [d, a]; }
  return best;
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = dark ? '#000' : '#fff'; ctx.fillRect(0, 0, W, H);
  const B = basis(cam.yaw, cam.pitch);
  let scale = Math.min(W, H) * 0.40; const cx = W / 2, cy = H / 2;
  if (PULSE) {   // 拍頭で膨らんで減衰（ノリ）。times があれば実際の打点に合わせる（ドリフト無し）
    let ph = 0, per = PULSE.period || 0.5;
    if (PULSE.times && PULSE.times.length) {
      let i = 0; const T = PULSE.times;
      while (i + 1 < T.length && T[i + 1] <= nowT) i++;
      ph = Math.max(0, nowT - T[i]); per = (i + 1 < T.length ? T[i + 1] - T[i] : per);
    } else { ph = ((nowT - PULSE.phase) % per + per) % per; }
    scale *= 1 + PULSE.amp * Math.exp(-ph / (per * 0.22));
  }
  window.__lastScale = scale;
  const ws = drawings.map(revealWeight), wmax = Math.max(0, ...ws);
  const px = Math.min(W, H) / 900;   // 線幅を解像度に合わせる
  const base = Math.max(0.12, 0.30 * Math.sqrt(3 / Math.max(3, drawings.length)));   // 枚数で塊の薄さを調整
  const order = drawings.map((_, i) => i).sort((a, b) => ws[a] - ws[b]);            // 揃った線画を最前面に
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const i of order) {
    const d = drawings[i], w = ws[i];
    const alpha = Math.max(0.08, Math.min(1, base + (1 - base) * w - 0.5 * base * (wmax - w)));
    const width = (1.0 + 1.7 * w) * 2 * px;
    for (const g of d.groups) {
      const color = dark ? brighten(g.color) : g.color;
      ctx.beginPath();
      for (const s of g.strokes) {
        for (let k = 0; k < s.length; k += 3) {
          const sx = (s[k] * B.right[0] + s[k + 1] * B.right[1] + s[k + 2] * B.right[2]) * scale + cx;
          const sy = -(s[k] * B.up[0] + s[k + 1] * B.up[1] + s[k + 2] * B.up[2]) * scale + cy;
          if (k === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        }
      }
      if (w > 0.05) { ctx.strokeStyle = rgba(color, 0.28 * w); ctx.lineWidth = width + 10 * px; ctx.stroke(); }
      ctx.strokeStyle = rgba(color, alpha); ctx.lineWidth = width; ctx.stroke();
    }
  }
  const n = nearest();
  const w = n ? revealWeight(n[0]) : 0;
  label.textContent = n ? n[0].label : ''; label.style.opacity = w;
  hud.textContent = `yaw ${cam.yaw.toFixed(0)}°  pitch ${cam.pitch.toFixed(0)}°`;
  document.querySelectorAll('#jump button').forEach((b, i) => b.classList.toggle('on', ws[i] > 0.5));
}

// ===== 自動ツアー（時間の関数＝動画書き出しでも同じ動き） =====
let MOVE = 2.2, HOLD = 1.6;   // SR.setup で差し替え可（BPM 同期用）
let SCHEDULE = null;           // [{move,hold},...] 区間ごとに違う長さ（曲のノリに合わせる）
let PULSE = null;              // {period, phase, amp} 拍ごとに塊が脈打つ
let nowT = 0;
let headless = false;          // 動画書き出し中は RAF ループを止める（壁時計で上書きされるのを防ぐ）
const cycle = () => SCHEDULE ? SCHEDULE.reduce((a, s) => a + s.move + s.hold, 0) : drawings.length * (MOVE + HOLD);
function tourPose(t) {
  const n = drawings.length; if (!n) return { yaw: 0, pitch: 0 };
  const C = cycle(); t = ((t % C) + C) % C;
  let i = 0, u = t, move = MOVE, hold = HOLD;
  if (SCHEDULE) {
    for (i = 0; i < SCHEDULE.length; i++) { const L = SCHEDULE[i].move + SCHEDULE[i].hold; if (u < L) break; u -= L; }
    i = Math.min(i, SCHEDULE.length - 1); move = SCHEDULE[i].move; hold = SCHEDULE[i].hold;
  } else { const seg = MOVE + HOLD; i = Math.floor(t / seg); u = t - i * seg; }
  const a = drawings[i % n].view, b = drawings[(i + 1) % n].view;
  if (u < hold) return { yaw: a.yaw, pitch: a.pitch };
  const k = smooth((u - hold) / move);
  return { yaw: a.yaw + wrap(b.yaw - a.yaw) * k, pitch: a.pitch + (b.pitch - a.pitch) * k };
}

function step(now) {
  if (headless) return;
  const t = now / 1000, dt = lastT ? Math.min(0.05, t - lastT) : 0; lastT = t;
  nowT = t - tourT0 + tourOffset;
  if (tour) {
    const p = tourPose(nowT); cam.yaw = wrap(p.yaw); cam.pitch = p.pitch;
  } else if (!dragging && dt > 0) {
    const sp = Math.hypot(vel[0], vel[1]);
    if (sp > 2) {
      cam.yaw = wrap(cam.yaw + vel[0] * dt); cam.pitch = Math.max(-85, Math.min(85, cam.pitch + vel[1] * dt));
      const dmp = Math.pow(0.03, dt); vel = [vel[0] * dmp, vel[1] * dmp];
    } else {
      vel = [0, 0];
      const n = nearest();
      if (n && n[1] < DATA.revealAngleDeg && n[1] > 0.05) {
        const k = 1 - Math.pow(0.001, dt);
        cam.yaw = wrap(cam.yaw + wrap(n[0].view.yaw - cam.yaw) * k); cam.pitch += (n[0].view.pitch - cam.pitch) * k;
      }
    }
  }
  draw();
  requestAnimationFrame(step);
}

// ===== 入力 =====
const DPP = 0.45;
canvas.addEventListener('pointerdown', e => { dragging = true; last = [e.clientX, e.clientY, performance.now()]; vel = [0, 0]; tour = false; ui.tour.classList.remove('on'); canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now(), dt = Math.max(1 / 120, (now - last[2]) / 1000);
  const dyaw = -(e.clientX - last[0]) * DPP, dp = (e.clientY - last[1]) * DPP;
  cam.yaw = wrap(cam.yaw + dyaw); cam.pitch = Math.max(-85, Math.min(85, cam.pitch + dp));
  let v = [vel[0] * 0.5 + dyaw / dt * 0.5, vel[1] * 0.5 + dp / dt * 0.5];
  const sp = Math.hypot(v[0], v[1]); if (sp > 180) v = [v[0] / sp * 180, v[1] / sp * 180];
  vel = v; last = [e.clientX, e.clientY, now];
});
const endDrag = () => { dragging = false; };
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

const ui = { tour: document.getElementById('tour'), bg: document.getElementById('bg'), rec: document.getElementById('rec'), png: document.getElementById('png') };
const jump = document.getElementById('jump');
drawings.forEach(d => { const b = document.createElement('button'); b.textContent = d.label; b.onclick = () => { tour = false; ui.tour.classList.remove('on'); vel = [0, 0]; animateTo(d.view); }; jump.appendChild(b); });
function animateTo(v) {
  const y0 = cam.yaw, p0 = cam.pitch, y1 = y0 + wrap(v.yaw - y0), p1 = v.pitch, t0 = performance.now();
  (function f() { const k = smooth((performance.now() - t0) / 700); cam.yaw = wrap(y0 + (y1 - y0) * k); cam.pitch = p0 + (p1 - p0) * k; if (k < 1) requestAnimationFrame(f); })();
}
ui.tour.onclick = () => { tour = !tour; ui.tour.classList.toggle('on', tour); if (tour) { tourT0 = performance.now() / 1000; tourOffset = 0; } };
ui.bg.onclick = () => { dark = !dark; document.body.classList.toggle('light', !dark); ui.bg.textContent = dark ? '◐ 黒背景' : '◑ 白背景'; };
ui.png.onclick = () => { const a = document.createElement('a'); a.download = 'angleon.png'; a.href = canvas.toDataURL('image/png'); a.click(); };

// ブラウザ内録画（webm）。mp4 が要るなら render_video.py
let recorder = null, chunks = [];
ui.rec.onclick = () => {
  if (recorder) { recorder.stop(); return; }
  const stream = canvas.captureStream(60);
  const mime = ['video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m)) || '';
  recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 }); chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = () => { const a = document.createElement('a'); a.download = 'angleon.webm'; a.href = URL.createObjectURL(new Blob(chunks, { type: 'video/webm' })); a.click(); recorder = null; ui.rec.innerHTML = '● 録画'; ui.rec.classList.remove('on'); };
  recorder.start(); ui.rec.innerHTML = '<span id="recdot"></span>停止'; ui.rec.classList.add('on');
};

// ===== 動画書き出し用の同期 API（render_video.py が呼ぶ） =====
window.SR = {
  cycleSeconds: cycle,
  setup(w, h, opts = {}) { headless = true; fixedSize = [w, h]; dark = opts.dark !== false; if (opts.move) MOVE = opts.move; if (opts.hold) HOLD = opts.hold; if (opts.schedule) SCHEDULE = opts.schedule; if (opts.pulse) PULSE = opts.pulse; document.body.classList.toggle('light', !dark); document.body.classList.add('norec'); resize(); return { drawings: drawings.map(d => d.id), points: drawings.reduce((a, d) => a + d.pointCount, 0) }; },
  render(t) { nowT = t; const p = tourPose(t); cam.yaw = wrap(p.yaw); cam.pitch = p.pitch; draw(); return true; },
  frame() { return canvas.toDataURL('image/png'); },
};

cam.yaw = 38; cam.pitch = 20; let idleTimer = setTimeout(() => { tour = true; ui.tour.classList.add('on'); tourT0 = performance.now() / 1000; tourOffset = 0; }, 2500);
canvas.addEventListener('pointerdown', () => { clearTimeout(idleTimer); document.getElementById('hint').style.opacity = 0; }, { once: true });
const q = new URLSearchParams(location.search);
if (q.get('bg') === 'white') ui.bg.onclick();
if (q.get('tour') === '1') ui.tour.onclick();
requestAnimationFrame(step);
</script>
</body>
</html>
